api_version = "2026-04"

[[extensions]]
name = "thank-you-referral"
handle = "thank-you-referral"
type = "ui_extension"
uid = "a2b9c8d4-0f3e-4e7b-9c1f-8d6a2b5e4f77"

[[extensions.targeting]]
module = "./src/index.jsx"
target = "purchase.thank-you.block.render"

[extensions.capabilities]
api_access = true
network_access = true

[[extensions.metafields]]
namespace = "$app"
key = "requestedFreeGift"

[[extensions.settings.fields]]
key = "referral_heading"
type = "single_line_text_field"
name = "Referral Heading"
default = "Give ₹, Get ₹"
[[extensions.settings.fields.validations]]
name = "max"
value = "60"

[[extensions.settings.fields]]
key = "referral_text"
type = "multi_line_text_field"
name = "Referral Description"
default = "Invite friends and earn rewards when they purchase"
[[extensions.settings.fields.validations]]
name = "max"
value = "160"

[[extensions.settings.fields]]
key = "referral_cta_text"
type = "single_line_text_field"
name = "Referral CTA Text"
default = "Refer a Friend"
[[extensions.settings.fields.validations]]
name = "max"
value = "24"

[[extensions.settings.fields]]
key = "referral_cta_link"
type = "single_line_text_field"
name = "Referral CTA Link"
[[extensions.settings.fields.validations]]
name = "max"
value = "2048"
